# maps — offline RGB565 slippy-map viewer (LCD + browser).
#
# An LCD launcher program that blits pre-baked RGB565 tiles read from SD
# (default /sdcard/maps/<z>/<x>/<y>.bin) centred on the live GPS fix.
# Reads the fix via ephemeral gps.* keys — no compile-time GPS dep, so
# the GNSS chip can live in the consuming buildable straddle (hw-tdeck)
# until a GPS service abstraction earns its own straddle.
#
# Independent of the RNS family — published under `reticulous/` for
# discoverability, but any LCD buildable straddle can consume it. Doubles as
# the docs' "first non-RNS feature straddle" walkthrough.
#
# Tooling: scripts/maketiles.py runs on a workstation to bake tiles into
# the device's SD format. Never on the device.
schema_version: 1
name: reticulous/maps
prefix: maps
version: 0.1.0
firmware: esp-idf
browser: browser
platforms: [idf]
requires:
  - spangap/spangap-core
optional_requires:
  # The whole maps program is the LCD viewer — maps.cpp is wrapped in
  # #if CONFIG_SPANGAP_LCD with a no-op #else arm. With --no-lcd, maps
  # stages but compiles to nothing.
  - spangap/spangap-lcd
# Auto-init: folded into the buildable's generated spangapInitStraddles().
# mapsInit() sets storage defaults, registers a CLI verb, spawns the render
# worker, and self-registers its LCD launcher program + Settings pane (the lcd
# task reads those registries lazily, so registering before lcdInit is fine).
# GPS position arrives via storageSubscribeChanges on gps.lat/gps.lon —
# event-driven, no ordering dependency on any GNSS init. Default order (100).
init:
  - call: mapsInit
