# maps — offline slippy-map viewer (LCD).
#
# An LCD launcher program that blits pre-baked map tiles read from SD
# (default /sdcard/maps/<z>/<x>/<y>.jpg, raw .bin fallback) centred on the
# live GPS fix. Reads the fix via ephemeral gps.* keys — no compile-time GPS
# dep, so the GNSS chip can live in the consuming buildable straddle (hw-tdeck)
# until a GPS service abstraction earns its own straddle.
#
# On-device viewer only — there is no browser UI.
#
# Independent of the RNS family — published under `reticulous/` for
# discoverability, but any LCD buildable straddle can consume it. Doubles as
# the docs' "first non-RNS feature straddle" walkthrough.
#
# Tooling: tilebake/ bakes tiles on a workstation into the device's SD format.
# Never on the device.
schema_version: 1
name: reticulous/maps
prefix: maps
version: 0.0.0
firmware: esp-idf
platforms: [idf]
# spangap-core is implicit (the empty-prefix platform foundation) — not listed.
# Auto-init: folded into the buildable's generated spangapInitStraddles().
# mapsInit() is a no-op; mapsLcdRegister() (the when:-gated hook below) registers
# a CLI verb, spawns the render worker, and self-registers the LCD launcher
# program. The launcher registration (lcdInstall) is NOT lazy — it posts to the
# lcd task and bails if that task doesn't exist yet — but the platform band brings
# lcd up before the straddle band, so by the time the hook runs the lcd task is
# guaranteed live. (GPS position arrives via storageSubscribeChanges on
# gps.lat/gps.lon — event-driven, no ordering dependency on any GNSS init.)
# Storage defaults + the Settings pane are generated from the settings: block.
init:
  - call: mapsInit
  - call: mapsLcdRegister
    when: spangap/spangap-lcd

# Declarative settings: the single source for the Maps pane (LCD + web) and its
# storage defaults. zoom 1..19 (slippy levels); maps.state is ephemeral, shown
# read-only. Replaces the hand-written mapsSettingsPane + storageDefault trio.
settings:
  - menu:
      - { id: maps, label: "Maps" }
    rows:
      - section: "Map"
      - slider: { label: "Zoom",     key: "s.maps.zoom",    min: 1, max: 19, default: 15 }
      - value:  { label: "Status",   key: "maps.state" }
      - text:   { label: "Tile dir", key: "s.maps.tiledir", default: "/sdcard/maps" }
